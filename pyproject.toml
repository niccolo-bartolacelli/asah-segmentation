[project]
name = "asah-segmentation"
version = "0.1.0"
description = "Aneurysmal Subarachnoid Hemorrage segmentation on Non-Contrast CT Scans"
readme = "README.md"
authors = [
    { name = "Niccolò Bartolacelli", email = "niccolo.bartolacelli@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "nibabel>=5.4.2",
    "nilearn>=0.14.1",
    "numpy>=2.5.3",
    "torch>=2.14.0",
]

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
legacy = [
    "tensorflow>=2.22.0rc0"
]
